# 저장소 전체 Git 이력에서 비밀정보(API Key, 토큰 등)를 검사합니다.
# - pre-commit 은 설치한 사람에게만 동작하므로, 서버(CI)에서 한 번 더 검사합니다.
# - 실행 결과 화면은 보안점검서의 "비밀정보가 Git 이력에 없음" 점검 근거로 첨부하세요. (가이드 3.3, 평가표 보안)
name: Secret Scan

on:
  push:
    branches: [main, develop]   # ① 보호 브랜치에 merge된 결과만 재검사
  pull_request:                 # PR은 대상 브랜치 상관없이 항상 검사 (Ruleset 필수 check)
  workflow_dispatch:

permissions:
  contents: read

# ② 같은 브랜치/PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2
  # 공식 릴리스 checksums.txt 의 linux_x64 값 (다운로드 파일 무결성 검증 - OWASP A08)
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
  # 릴리스 다운로드 실패 시 쓰는 공식 컨테이너 이미지 digest (같은 버전, 보안점검서 I-4) — 버전을 바꾸면 함께 갱신
  GITLEAKS_IMAGE_DIGEST: sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46

jobs:
  gitleaks:                     # ⚠ Ruleset check 이름 — 바꾸거나 name: 추가하지 말 것
    runs-on: ubuntu-latest
    timeout-minutes: 10         # ③ 멈춘 실행이 PR을 계속 막지 않도록
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 커밋 이력 검사
          persist-credentials: false   # ④ 이후 단계에 GITHUB_TOKEN 남기지 않음

      # ⑥ 릴리스 다운로드 일시 장애(504 등)로 필수 check 가 막히지 않도록
      #    재시도 → 그래도 실패하면 다음 단계에서 같은 버전의 공식 컨테이너 이미지로 검사
      - name: Install gitleaks (checksum verified)
        id: install
        continue-on-error: true
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history
        run: |
          ARGS="git --redact --verbose --report-format json --report-path gitleaks-report.json ."
          if [ "${{ steps.install.outcome }}" = "success" ]; then
            ./gitleaks $ARGS
          else
            echo "::warning::gitleaks 릴리스 다운로드 실패 → 공식 컨테이너 이미지(v${GITLEAKS_VERSION})로 검사"
            # runner 와 같은 uid 로 실행 → 리포트 파일 쓰기 가능, git '소유자 불일치(dubious ownership)' 방지
            docker run --rm --user "$(id -u):$(id -g)" \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              -v "$PWD:/repo" -w /repo \
              "ghcr.io/gitleaks/gitleaks:v${GITLEAKS_VERSION}@${GITLEAKS_IMAGE_DIGEST}" $ARGS
          fi

      # ⑤ 보안점검서 근거 자료로 쓸 리포트 보관 (실패해도 업로드)
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30
