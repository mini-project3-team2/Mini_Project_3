# =========================================================
#  frontend Nginx 설정 (nginxinc/nginx-unprivileged · 비root uid 101)
#  Dockerfile:  COPY nginx.conf /etc/nginx/conf.d/default.conf
#
#  - React 정적 파일 서빙 + SPA 라우팅 fallback
#  - /api/** 만 backend 로 리버스 프록시 (/actuator 등 그 외 경로는 외부에 노출하지 않음)
#  - 업로드 /api/documents   : client_max_body_size 12m · proxy_read_timeout 150s · 413 JSON
#  - 스트리밍 /api/chats/stream : proxy_buffering off · proxy_read_timeout 120s
#  - 클라이언트 IP 별 요청 횟수 제한(limit_req) : 인증 20회/분 · 질문 10회/분 · 업로드(POST) 6회/분, 초과 시 429 JSON
#  근거: docs/4.API설계서.md 4.1(업로드) · 5.1(스트리밍), docs/2.시스템아키텍처설계서.md 6장
# =========================================================

# ---------- 클라이언트 IP 별 요청 횟수 제한 (보안점검서 A-4 · 7장) ----------
# 무차별 대입 · LLM / 임베딩 비용 소모 방지. 이 파일은 nginx 의 http { } 안에 include 되므로 여기서 zone 을 선언한다.
# EC2 에서는 frontend 가 외부 요청을 직접 받으므로 $binary_remote_addr = 실제 접속 IP
limit_req_zone $binary_remote_addr zone=auth:10m   rate=20r/m;   # 로그인 · 가입 · 재발급 · 로그아웃
limit_req_zone $binary_remote_addr zone=chat:10m   rate=10r/m;   # 질문 (LLM 비용)

# 업로드는 POST 만 제한 — 같은 경로의 목록 조회(GET)는 화면 이동마다 호출되므로 제외 (키가 빈 값이면 제한하지 않음)
map $request_method $upload_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $upload_limit_key zone=upload:10m rate=6r/m;      # 업로드 (임베딩 비용)

limit_req_status 429;                   # 기본 503 대신 429 (API 설계서 2.4)

server {
    listen 8080;                        # 비root 실행 → 1024 미만 포트 대신 8080 (Compose 에서 80 → 8080 매핑)
    server_name _;

    server_tokens off;                  # 응답 헤더 · 오류 페이지에 nginx 버전 숨김

    root  /usr/share/nginx/html;
    index index.html;

    # 업로드 외 API 의 요청 본문 기본 제한 (질문 1000자 등 JSON 요청은 1m 로 충분)
    client_max_body_size 1m;

    # ---------- 보안 헤더 ----------
    # ⚠️ add_header 는 하위 location 에 add_header 가 하나라도 있으면 상속되지 않는다.
    #    → 아래 location 들에는 add_header 를 쓰지 않는다. (캐시는 expires 로 지정)
    # always: 4xx/5xx(413 JSON 포함) 응답에도 헤더를 붙인다.
    # CSP 최종 값은 6번 문서(Frontend 개발명세서)에서 확정 → 확정 후 이 줄만 수정
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- backend 공통 프록시 헤더 ----------
    # Backend 는 server.forward-headers-strategy: native → 감사 로그에 실제 접속 IP 기록
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- 1) 자료 업로드 · 목록 : /api/documents ----------
    # 정확히 일치하는 경로만 (DELETE /api/documents/{id} 는 아래 /api/ 로 처리)
    location = /api/documents {
        # 파일 10MB < Spring 요청 11MB < Tomcat swallow · nginx 12MB
        # (nginx 가 정상 PDF 를 먼저 막지 않도록 Spring 제한보다 여유 있게)
        client_max_body_size 12m;

        # 적재 대기: Backend 최대 처리 시간(AI 120s + 청크 삭제 10s)보다 길게
        # (기본 60s 면 적재 중 nginx 가 먼저 504 HTML 로 끊음)
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;

        # 12MB 초과는 Spring 까지 가지 않고 nginx 가 차단 → HTML 대신 API 공통 오류 JSON
        error_page 413 = @file_too_large;

        # 업로드(POST)만 IP 별 분당 6회 (+ 순간 3회 허용), 목록(GET)은 제한 없음
        limit_req zone=upload burst=3 nodelay;
        error_page 429 = @too_many_requests;

        proxy_pass http://backend:8080;
    }

    # ---------- 2) 답변 스트리밍(SSE) : /api/chats/stream ----------
    location = /api/chats/stream {
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # 업스트림 연결 유지 (hop-by-hop 헤더 제거)
        # 위에서 Connection 을 다시 설정해 server 의 proxy_set_header 상속이 끊기므로 다시 지정
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                # 토큰이 생성되는 즉시 화면으로 전달
        proxy_cache off;
        gzip off;                           # 압축 버퍼링으로 이벤트가 모이지 않게

        # Backend 스트리밍 타임아웃(60s)보다 길게 → 타임아웃 시 nginx 가 아닌 Backend 가 error 이벤트로 응답
        proxy_read_timeout 120s;

        # 질문은 IP 별 분당 10회 (+ 순간 5회 허용)
        limit_req zone=chat burst=5 nodelay;
        error_page 429 = @too_many_requests;

        proxy_pass http://backend:8080;
    }

    # ---------- 2-1) 인증 : /api/auth/** ----------
    location ^~ /api/auth/ {
        # IP 별 분당 20회 (+ 순간 10회 허용). 계정 잠금(5회 실패)과 함께 무차별 대입 방어
        limit_req zone=auth burst=10 nodelay;
        error_page 429 = @too_many_requests;

        # ⚠️ URI 없이 지정해야 /api/auth/... 경로가 그대로 전달됨 (끝에 / 를 붙이면 /api/auth/ 가 / 로 바뀌어 404)
        proxy_pass http://backend:8080;
    }

    # ---------- 3) 그 외 API : /api/** ----------
    location /api/ {
        proxy_pass http://backend:8080;     # URI 없이 지정 → /api/... 경로 그대로 전달
    }

    # ---------- 413 JSON (API 설계서 2장 공통 오류 형식) ----------
    location @file_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;     # Content-Type: application/json; charset=utf-8
        return 413 '{"success":false,"data":null,"message":"파일 크기는 10MB 이하여야 합니다","code":"FILE_TOO_LARGE"}';
    }

    # ---------- 429 JSON (API 설계서 2장 공통 오류 형식) ----------
    location @too_many_requests {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 429 '{"success":false,"data":null,"message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요","code":"TOO_MANY_REQUESTS"}';
    }

    # ---------- 정적 파일 ----------
    # Vite 빌드 산출물은 파일명에 해시가 붙으므로 오래 캐시
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Actuator 는 외부에 노출하지 않음 (backend 로 프록시하지 않고 404)
    #  → 보안점검서 B-7 근거: http://<서버>/actuator/health → 404
    location ^~ /actuator {
        return 404;
    }

    # 숨김 파일(.env, .git 등) 접근 차단
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA 라우팅: /login, /chat 등 새로고침 시 index.html 로 fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;                         # index.html 은 캐시하지 않음 (배포 직후 새 번들 반영)
    }
}
