# 비밀이 아닌 설정 (docker-compose.prod.yml 의 environment 중 일반 값)
# 비밀 값(비밀번호 · 토큰 · API Key)은 Secret `asknote-secret` 에만 둔다 (secret.example.yaml 참고)
apiVersion: v1
kind: ConfigMap
metadata:
  name: asknote-config
  namespace: asknote
data:
  TZ: Asia/Seoul
  # database
  MARIADB_DATABASE: asknote
  MARIADB_USER: asknote_app            # 앱 전용 계정 (root 미사용)
  # backend
  DB_HOST: database                    # Service 이름 = Compose 서비스 이름 → 이미지 · 설정 수정 없이 동작
  DB_PORT: "3306"
  AI_SERVICE_URL: http://ai-service:8000
  JWT_ACCESS_EXPIRATION: "900000"      # 15분
  JWT_REFRESH_EXPIRATION: "86400000"   # 1일
  CORS_ALLOWED_ORIGINS: http://localhost:8080   # kubectl port-forward 접속 주소와 일치해야 함
  ACTUATOR_EXPOSURE: health,info
  LOGIN_LOCK_MINUTES: "15"
  # ai-service
  LLM_PROVIDER: openai
  LLM_MODEL: gpt-4o-mini
  EMBEDDING_PROVIDER: openai
  EMBEDDING_MODEL: text-embedding-3-small
  CHROMA_PERSIST_DIRECTORY: /data/chroma
