# kubectl apply -k k8s/ 로 한 번에 적용
# Secret(asknote-secret)은 여기에 넣지 않는다 → README 2단계에서 저장소 밖 env 파일로 생성
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - database.yaml
  - ai-service.yaml
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
# 앱 이미지 태그를 한곳에서 관리 — 11/10 테스트 당시 운영 이미지 sha 태그 (latest 미사용)
images:
  - name: ekrong01/asknote-frontend
    newTag: sha-7d08b42
  - name: ekrong01/asknote-backend
    newTag: sha-7d08b42
  - name: ekrong01/asknote-ai
    newTag: sha-7d08b42
