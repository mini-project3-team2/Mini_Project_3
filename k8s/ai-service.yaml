# AI Module (FastAPI + Chroma) — Compose 의 ai-service 서비스 + chroma-data 볼륨
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: asknote
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: asknote
  labels: {app: ai-service}
spec:
  replicas: 1
  strategy: {type: Recreate}           # Chroma(PersistentClient)는 한 프로세스만 써야 함
  selector:
    matchLabels: {app: ai-service}
  template:
    metadata:
      labels: {app: ai-service}
    spec:
      securityContext:
        fsGroup: 999                     # chroma-data 볼륨을 app 그룹이 쓸 수 있게
      containers:
        - name: ai-service
          image: ekrong01/asknote-ai   # 태그는 kustomization.yaml 의 images 에서 지정
          ports:
            - containerPort: 8000
          env:
            - {name: TZ, valueFrom: {configMapKeyRef: {name: asknote-config, key: TZ}}}
            - {name: LLM_PROVIDER, valueFrom: {configMapKeyRef: {name: asknote-config, key: LLM_PROVIDER}}}
            - {name: LLM_MODEL, valueFrom: {configMapKeyRef: {name: asknote-config, key: LLM_MODEL}}}
            - {name: EMBEDDING_PROVIDER, valueFrom: {configMapKeyRef: {name: asknote-config, key: EMBEDDING_PROVIDER}}}
            - {name: EMBEDDING_MODEL, valueFrom: {configMapKeyRef: {name: asknote-config, key: EMBEDDING_MODEL}}}
            - {name: CHROMA_PERSIST_DIRECTORY, valueFrom: {configMapKeyRef: {name: asknote-config, key: CHROMA_PERSIST_DIRECTORY}}}
            - {name: AI_INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: asknote-secret, key: AI_INTERNAL_TOKEN}}}
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: asknote-secret, key: OPENAI_API_KEY}}}
            - {name: GROQ_API_KEY, valueFrom: {secretKeyRef: {name: asknote-secret, key: GROQ_API_KEY, optional: true}}}
          # 비root(app) 실행 명시 + Compose 의 no-new-privileges · cap_drop: ALL 과 동일
          securityContext:
            runAsNonRoot: true
            runAsUser: 999               # 이미지의 app 사용자 (kubectl exec ... id → uid=999(app))
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - {name: chroma-data, mountPath: /data/chroma}
      volumes:
        - name: chroma-data
          persistentVolumeClaim: {claimName: chroma-data}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service                     # backend 의 AI_SERVICE_URL=http://ai-service:8000
  namespace: asknote
spec:
  type: ClusterIP                      # 클러스터 내부 전용 (외부 비공개)
  selector: {app: ai-service}
  ports:
    - {port: 8000, targetPort: 8000}
