# ⚠️ 예시 파일 — 키 이름만 적고 값은 비워 둔다. 실제 값이 든 Secret yaml 은 커밋 금지(.gitignore: k8s/**/*secret*.yaml)
#    Secret 은 base64 인코딩일 뿐 암호화가 아니다.
#
# 실제 Secret 은 저장소 밖의 env 파일로 만든다 (README.md 2단계):
#   kubectl -n asknote create secret generic asknote-secret --from-env-file=<저장소 밖 경로>/k8s-secret.env
apiVersion: v1
kind: Secret
metadata:
  name: asknote-secret
  namespace: asknote
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: ""   # database
  MARIADB_PASSWORD: ""        # database · backend
  JWT_SECRET: ""              # backend (32바이트 이상)
  AI_INTERNAL_TOKEN: ""       # backend · ai-service
  ADMIN_EMAIL: ""             # backend
  ADMIN_PASSWORD: ""          # backend (8~20자 · 영문 · 숫자 · 특수문자)
  OPENAI_API_KEY: ""          # ai-service (LLM · 임베딩)
  GROQ_API_KEY: ""            # ai-service (선택, LLM_PROVIDER=groq 일 때만)
